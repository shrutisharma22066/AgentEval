[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenteval"
version = "0.1.0"
description = "Measure how reliably a tool-using LLM agent completes tasks, and how often it does something unsafe."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["agenteval*"]
